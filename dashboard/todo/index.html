<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task System</title>
  <link rel="stylesheet" href="./style.css?v=3" />
</head>
<body>
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">personal control room</div>
        <h1>TASK SYSTEM</h1>
        <div class="legend"><span>α CAREER</span><span>β CULTURE</span><span>γ SELF</span></div>
      </div>
      <div class="top-actions">
        <a class="link-btn" href="../">Job hunt ↗</a>
        <button class="btn primary" id="addTaskBtn">+ ADD TASK</button>
      </div>
    </header>

    <section class="focus glass">
      <div class="section-head"><div><div class="section-kicker">Priority</div><h2>FOCUS 3</h2></div><span class="muted">오늘 시선 둘 것</span></div>
      <div id="focusList" class="focus-list"></div>
    </section>

    <div class="workspace">
      <div class="main-column">
        <section class="inbox glass">
          <button class="inbox-head accordion-toggle expanded" type="button" data-toggle-section="inboxPanel">
            <div><div class="section-kicker">Capture</div><h2>INBOX</h2></div>
            <div class="accordion-meta"><span id="inboxCount">0</span><span class="chevron">⌄</span></div>
          </button>
          <div id="inboxPanel" class="accordion-panel open"><div id="inboxList" class="inbox-list"></div></div>
        </section>
        <div id="horizons"></div>
      </div>

      <aside class="side-column">
        <section class="calendar glass">
          <div class="calendar-head"><button id="prevMonth" class="icon-btn" type="button">←</button><div><div class="section-kicker">Calendar</div><h2 id="calendarTitle"></h2></div><button id="nextMonth" class="icon-btn" type="button">→</button></div>
          <div class="weekdays"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
          <div id="calendarGrid" class="calendar-grid"></div>
          <div id="dayAgenda" class="day-agenda"><div class="muted">날짜를 누르면 일정이 보임.</div></div>
        </section>
      </aside>
    </div>
  </main>

  <dialog id="taskDialog">
    <form id="taskForm">
      <div class="modal-head">TASK</div>
      <div class="form-grid">
        <input type="hidden" name="id" />
        <div class="field full"><label>할 일</label><input name="text" required /></div>
        <div class="field"><label>기간</label><select name="horizon"><option value="quarter">QUARTER</option><option value="month">MONTH</option><option value="week">WEEK</option><option value="today">DAY</option><option value="inbox">INBOX</option></select></div>
        <div class="field"><label>영역</label><select name="area"><option value="alpha">Alpha · 취준</option><option value="beta">Beta · 교양/취미</option><option value="gamma">Gamma · 자기관리</option><option value="none">미분류</option></select></div>
        <div class="field"><label>기한</label><input name="due" type="date" /></div>
        <div class="field"><label>중요도</label><select name="priority"><option value="normal">보통</option><option value="high">높음</option><option value="low">낮음</option></select></div>
        <label class="focus-check"><input type="checkbox" name="focus" value="yes" /> <span>FOCUS 3에 표시</span></label>
        <div class="field full"><label>메모</label><textarea name="notes" placeholder="필요하면 짧게"></textarea></div>
      </div>
      <div class="modal-actions"><button type="button" class="btn" id="cancelTaskBtn">취소</button><button type="submit" class="btn primary">저장</button></div>
    </form>
  </dialog>

  <script src="./app.js?v=3"></script>
</body>
</html>
