<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task System</title>
  <link rel="stylesheet" href="./style.css?v=10" />
</head>
<body>
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">personal control room</div>
        <h1>TASK SYSTEM</h1>
      </div>
      <div class="top-actions"><a class="link-btn" href="../">Job hunt ↗</a></div>
    </header>

    <section class="focus glass">
      <div class="section-head"><div><div class="section-kicker">Priority</div><h2>FOCUS 3</h2></div></div>
      <div id="focusList" class="focus-list"></div>
    </section>

    <div class="workspace">
      <div class="main-column"><div id="horizons"></div></div>
      <aside class="side-column">
        <section class="calendar glass">
          <div class="calendar-toolbar">
            <button id="prevMonth" class="icon-btn" type="button">←</button>
            <button id="openCalendar" class="calendar-title-button" type="button"><div class="section-kicker">Calendar</div><h2 id="calendarTitle"></h2></button>
            <button id="nextMonth" class="icon-btn" type="button">→</button>
          </div>
          <div class="weekdays"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
          <div id="calendarGrid" class="calendar-grid"></div>
          <div id="dayAgenda" class="day-agenda"></div>
          <div class="calendar-actions"><button id="addCalendarEvent" class="btn" type="button">+ 일정</button></div>
        </section>

        <button class="inbox-line" id="openInbox" type="button"><span>INBOX</span><span class="inbox-line-meta"><span id="inboxCount">0</span><span>↗</span></span></button>
      </aside>
    </div>
  </main>

  <dialog id="horizonDialog" class="horizon-dialog large-glass-dialog">
    <div class="horizon-popup-head">
      <div><div class="section-kicker">Planning horizon</div><h2 id="horizonDialogTitle">DAY</h2><div id="horizonTrail" class="horizon-trail"></div></div>
      <div class="popup-head-actions"><button type="button" class="btn popup-add-task" id="addHorizonTask">+ ADD TASK</button><button type="button" class="icon-btn close-popup" id="closeHorizonDialog">×</button></div>
    </div>
    <div id="horizonDialogBody" class="horizon-dialog-body"></div>
  </dialog>

  <dialog id="inboxDialog" class="horizon-dialog large-glass-dialog">
    <div class="horizon-popup-head">
      <div><div class="section-kicker">Capture</div><h2>INBOX</h2></div>
      <div class="popup-head-actions"><button type="button" class="btn" id="addInboxTask">+ ADD TASK</button><button type="button" class="icon-btn close-popup" id="closeInboxDialog">×</button></div>
    </div>
    <div class="inbox-popup-body" id="inboxList"></div>
  </dialog>

  <dialog id="calendarDialog" class="calendar-dialog large-glass-dialog">
    <div class="horizon-popup-head">
      <div><div class="section-kicker">Calendar</div><h2 id="calendarDialogTitle"></h2></div>
      <div class="popup-head-actions"><button type="button" class="btn" id="addCalendarEventLarge">+ 일정</button><button type="button" class="icon-btn close-popup" id="closeCalendarDialog">×</button></div>
    </div>
    <div class="calendar-dialog-body">
      <div class="calendar-large-nav"><button id="prevMonthLarge" class="icon-btn" type="button">←</button><button id="nextMonthLarge" class="icon-btn" type="button">→</button></div>
      <div class="weekdays large-weekdays"><span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span></div>
      <div id="calendarGridLarge" class="calendar-grid calendar-grid-large"></div>
      <div id="calendarAgendaLarge" class="calendar-agenda-large"></div>
    </div>
  </dialog>

  <dialog id="taskDialog">
    <form id="taskForm">
      <div class="modal-head">TASK</div>
      <div class="form-grid">
        <input type="hidden" name="id" />
        <div class="field full"><label>할 일</label><input name="text" required /></div>
        <div class="field"><label>기간</label><select name="horizon"><option value="today">DAY</option><option value="week">WEEK</option><option value="month">MONTH</option><option value="quarter">QUARTER</option><option value="inbox">INBOX</option></select></div>
        <div class="field"><label>영역</label><select name="area"><option value="alpha">ALPHA</option><option value="beta">BETA</option><option value="gamma">GAMMA</option><option value="none">미분류</option></select></div>
        <div class="field"><label>기한</label><input name="due" type="date" /></div>
        <div class="field"><label>중요도</label><select name="priority"><option value="normal">보통</option><option value="high">높음</option><option value="low">낮음</option></select></div>
        <label class="focus-check"><input type="checkbox" name="focus" value="yes" /> <span>FOCUS 3에 표시</span></label>
        <div class="field full"><label>메모</label><textarea name="notes" placeholder="필요하면 짧게"></textarea></div>
      </div>
      <div class="modal-actions"><button type="button" class="btn danger" id="deleteTaskBtn">삭제</button><button type="button" class="btn" id="cancelTaskBtn">취소</button><button type="submit" class="btn primary">저장</button></div>
    </form>
  </dialog>

  <dialog id="eventDialog">
    <form id="eventForm">
      <div class="modal-head">CALENDAR EVENT</div>
      <div class="form-grid">
        <input type="hidden" name="id" />
        <div class="field full"><label>일정</label><input name="text" required /></div>
        <div class="field"><label>날짜</label><input name="date" type="date" required /></div>
        <div class="field"><label>색상</label><div class="color-picker">
          <label><input type="radio" name="color" value="red" checked><span class="swatch red"></span></label>
          <label><input type="radio" name="color" value="orange"><span class="swatch orange"></span></label>
          <label><input type="radio" name="color" value="yellow"><span class="swatch yellow"></span></label>
          <label><input type="radio" name="color" value="green"><span class="swatch green"></span></label>
          <label><input type="radio" name="color" value="blue"><span class="swatch blue"></span></label>
          <label><input type="radio" name="color" value="purple"><span class="swatch purple"></span></label>
        </div></div>
        <div class="field full"><label>메모</label><textarea name="notes" placeholder="필요하면 짧게"></textarea></div>
      </div>
      <div class="modal-actions"><button type="button" class="btn danger" id="deleteEventBtn">삭제</button><button type="button" class="btn" id="cancelEventBtn">취소</button><button type="submit" class="btn primary">저장</button></div>
    </form>
  </dialog>

  <script src="./app.js?v=10"></script>
</body>
</html>
