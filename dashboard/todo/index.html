<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task System</title>
  <link rel="stylesheet" href="./style.css?v=1" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">personal control room</div>
        <h1>TASK SYSTEM</h1>
        <div class="title-rule"></div>
      </div>
      <div class="top-actions">
        <a class="link-btn" href="../">Job hunt ↗</a>
        <button class="btn primary" id="addTaskBtn">+ 추가</button>
      </div>
    </header>

    <section class="inbox glass">
      <div class="section-head"><div><div class="section-kicker">Capture</div><h2>Inbox</h2></div><span class="muted">분류 전 임시 보관</span></div>
      <div id="inboxList" class="inbox-list"></div>
    </section>

    <div id="horizons"></div>
  </main>

  <dialog id="taskDialog">
    <form id="taskForm">
      <div class="modal-head">할 일</div>
      <div class="form-grid">
        <input type="hidden" name="id" />
        <div class="field full"><label>할 일</label><input name="text" required /></div>
        <div class="field"><label>기간</label><select name="horizon"><option value="quarter">이번 분기</option><option value="month">이번 달</option><option value="week">이번 주</option><option value="today">오늘</option><option value="inbox">Inbox</option></select></div>
        <div class="field"><label>영역</label><select name="area"><option value="alpha">Alpha · 취준</option><option value="beta">Beta · 교양/취미</option><option value="gamma">Gamma · 자기관리</option><option value="none">미분류</option></select></div>
        <div class="field"><label>기한</label><input name="due" type="date" /></div>
        <div class="field"><label>중요도</label><select name="priority"><option value="normal">보통</option><option value="high">높음</option><option value="low">낮음</option></select></div>
        <div class="field full"><label>메모</label><textarea name="notes" placeholder="필요하면 짧게"></textarea></div>
      </div>
      <div class="modal-actions"><button type="button" class="btn" id="cancelTaskBtn">취소</button><button type="submit" class="btn primary">저장</button></div>
    </form>
  </dialog>

  <script src="./app.js?v=1"></script>
</body>
</html>
